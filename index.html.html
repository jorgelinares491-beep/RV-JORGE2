function parseOBJ(txt){const V=[],pos=[];
 for(const ln of txt.split('\n')){const p=ln.trim().split(/\s+/);

   for(let k=1;k<ix.length-1;k++)[ix[0],ix[k],ix[k+1]].forEach(i=>{const v=V[i];if(!v||!v.every(isFinite))throw new Error('El OBJ referencia vértices inexistentes o inválidos.');pos.push(v[0],v[1],v[2])})}}
